name: Public release verification and documentation

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: public-release-${{ github.ref }}
  cancel-in-progress: false

env:
  PYTHONDONTWRITEBYTECODE: '1'
  PIP_DISABLE_PIP_VERSION_CHECK: '1'
  PIP_CACHE_DIR: ${{ github.workspace }}/.cache/pip
  MPLCONFIGDIR: ${{ github.workspace }}/.cache/matplotlib
  XDG_CACHE_HOME: ${{ github.workspace }}/.cache/xdg
  NUMBA_CACHE_DIR: ${{ github.workspace }}/.cache/numba
  JOBLIB_TEMP_FOLDER: ${{ github.workspace }}/.cache/joblib

jobs:
  verify:
    name: Verify public application (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12.7'
      - name: Install reference dependencies and verify (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          & .\tools\Set-ProjectCache.ps1
          python -B -m pip install -r ci/requirements-reference.txt
          if ($LASTEXITCODE -ne 0) { throw 'Dependency installation failed' }
          python -B tools/run_public_ci_v1.py --output outputs/ci_public
          if ($LASTEXITCODE -ne 0) { throw 'Public verification failed' }
      - name: Install reference dependencies and verify (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          mkdir -p .cache/{temp,pip,matplotlib,xdg,numba,joblib}
          export TEMP="$GITHUB_WORKSPACE/.cache/temp"
          export TMP="$TEMP" TMPDIR="$TEMP"
          python -B -m pip install -r ci/requirements-reference.txt
          python -B tools/run_public_ci_v1.py --output outputs/ci_public
      - name: Retain public evidence and distributable files
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: public-release-${{ matrix.os }}
          path: |
            outputs/ci_artifacts/
            outputs/ci_public/public_pytest.log
            outputs/ci_public/public_pytest.xml
            outputs/ci_public/portability/*.log
          if-no-files-found: warn
          retention-days: 30

  documentation:
    name: Build public documentation
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12.7'
      - name: Build with strict link checks
        shell: bash
        run: |
          mkdir -p .cache/{temp,pip}
          export TEMP="$GITHUB_WORKSPACE/.cache/temp"
          export TMP="$TEMP" TMPDIR="$TEMP"
          python -B -m pip install -r ci/requirements-docs.txt -r ci/requirements-reference.txt
          python -B tools/build_docs_v1.py --output outputs/site
      - name: Configure GitHub Pages
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Retain rendered documentation
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: documentation-site
          path: |
            outputs/site/
            outputs/site_receipt.json
          retention-days: 30
      - name: Prepare Pages deployment
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: outputs/site

  deploy:
    name: Publish researcher documentation
    needs: documentation
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy verified documentation
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
